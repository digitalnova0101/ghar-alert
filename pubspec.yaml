name: gharalert
description: Ghar ke cameras se AI alert - silent phone pe bhi alarm bajta hai.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  flutter_local_notifications: ^22.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
